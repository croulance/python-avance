"Le protocole with":{"ctx": "Un verrou consultatif PostgreSQL garantit qu'un seul worker recalcule un calendrier : pris sur une connexion dédiée en autocommit, il est libéré par <code>__exit__</code> même si le recalcul échoue. Ou bien <code>pg_advisory_xact_lock</code>, libéré seul en fin de transaction.", "code": "LOCK = \"SELECT pg_advisory_lock(%s)\"\nUNLOCK = \"SELECT pg_advisory_unlock(%s)\"\nclass AdvisoryLock:   # un worker par bien\n    # cur : connexion dédiée en autocommit ;\n    # un rollback ne libère pas ce verrou\n    def __init__(self, cur, key):\n        self.cur, self.key = cur, key\n    def __enter__(self):\n        self.cur.execute(LOCK, [self.key])\n    def __exit__(self, exc_type, exc, tb):\n        self.cur.execute(UNLOCK, [self.key])\n        return False  # l'exception remonte\nwith AdvisoryLock(lock_cur, prop.id):\n    rebuild_calendar(prop)"},
"contextlib.contextmanager":{"ctx": "Un verrou distribué Redis empêche deux workers Celery de confirmer la même réservation : le <code>try/finally</code> autour du <code>yield</code> garantit la libération, même si la confirmation échoue. En prod, <code>r.lock()</code> de redis-py libère par un script Lua atomique.", "code": "@contextmanager\ndef redis_lock(r, name, ttl=30):\n    token = uuid.uuid4().hex\n    ok = r.set(name, token, nx=True, ex=ttl)\n    if not ok:\n        raise LockBusy(name)\n    try:\n        yield token\n    finally:  # ne supprime que le sien\n        # non atomique : en prod, r.lock()\n        if r.get(name) == token.encode():\n            r.delete(name)\nwith redis_lock(r, f\"booking:{ref}\"):\n    confirm_booking(ref)"},
"try, except, else, finally":{"ctx": "Capture d'un paiement : <code>except</code> traduit le refus de carte, <code>else</code> ne marque la réservation payée que si la capture a réussi, <code>finally</code> compte la tentative dans tous les cas.", "code": "def capture(b):\n    try:\n        res = gateway.capture(b.intent_id)\n    except CardError as e:\n        b.mark_failed(str(e))\n        raise PaymentFailed(b.ref) from e\n    else:\n        # hors du try : une erreur ici n'est\n        # pas prise pour un refus de carte\n        b.mark_paid(res.charge_id)\n    finally:\n        metrics.incr(\"payment.capture\")"},
"Hiérarchie et chaînage":{"ctx": "Le connecteur d'un partenaire traduit toute erreur httpx, réponse 4xx ou 5xx comme délai dépassé, en erreur métier avec <code>from e</code> : le traceback des logs montre l'erreur métier et, en cause, l'erreur httpx d'origine.", "code": "class SyncError(Exception):\n    pass\n\ndef push_rates(client, prop_id, rates):\n    url = f\"/properties/{prop_id}/rates\"\n    try:\n        r = client.put(url, json=rates)\n        r.raise_for_status()\n    except httpx.HTTPError as e:\n        # parente de HTTPStatusError (4xx,\n        # 5xx) et TransportError (timeout)\n        raise SyncError(prop_id) from e\n    # SyncError.__cause__ : l'erreur httpx"},
"MRO et super()":{"ctx": "Les vues Django à base de classes combinent des mixins : chacun appelle <code>super().dispatch()</code>, et le MRO fait passer la requête par le contrôle de connexion, puis l'audit, puis la vue.", "code": "class AuditMixin:\n    def dispatch(self, req, *a, **kw):\n        audit(req.user, req.path)\n        return super().dispatch(\n            req, *a, **kw)\n\nclass BookingDetail(LoginRequiredMixin,\n                    AuditMixin, DetailView):\n    model = Booking\n\n# MRO : BookingDetail, LoginRequiredMixin,\n# AccessMixin, AuditMixin, DetailView, ...\n# super() de LoginRequiredMixin mène donc\n# à AuditMixin, pas à DetailView"},
"Attributs de classe et d'instance":{"ctx": "Bug classique dans un connecteur : des en-têtes HTTP déclarés en attribut de classe puis modifiés via <code>self</code> sont partagés par toutes les instances, donc le jeton d'un partenaire fuit chez les autres.", "code": "AUTH = \"Authorization\"\n\nclass Connector:\n    headers = {\"Accept\": \"application/json\"}\n\n    def __init__(self, tok):\n        # Faux : self.headers[AUTH] = ...\n        # écrirait dans le dict de la classe\n        self.headers = dict(self.headers)\n        self.headers[AUTH] = f\"Bearer {tok}\""},
"property, classmethod, staticmethod":{"ctx": "Le modèle de séjour expose <code>nights</code> comme un attribut calculé, et le constructeur alternatif <code>from_partner</code> crée l'objet depuis le JSON d'un partenaire ; appelé sur une sous-classe, <code>cls</code> est cette sous-classe.", "code": "@dataclass\nclass Stay:\n    ref: str\n    start: date\n    end: date\n    @property\n    def nights(self) -> int:\n        return (self.end - self.start).days\n    @classmethod\n    def from_partner(cls, p: dict):\n        d = date.fromisoformat\n        return cls(p[\"id\"], d(p[\"arrival\"]),\n                   d(p[\"departure\"]))"},
"Les descripteurs":{"ctx": "Un descripteur réutilisable valide les montants de plusieurs classes (nuitée, caution) : c'est le mécanisme qu'emploient les champs des ORM comme Django ou SQLAlchemy.", "code": "class Cents:   # entier positif, en centimes\n    def __set_name__(self, owner, name):\n        self.name = \"_\" + name\n    def __get__(self, obj, objtype=None):\n        if obj is None:\n            return self\n        return getattr(obj, self.name)\n    def __set__(self, obj, v):\n        if type(v) is not int or v < 0:\n            raise ValueError(v)\n        setattr(obj, self.name, v)\nclass Rate:\n    nightly = Cents()\n    deposit = Cents()"},
"Intervenir à la création des classes":{"ctx": "Chaque connecteur de channel manager s'enregistre en héritant de la classe de base : la tâche de synchronisation choisit le connecteur d'après le code stocké sur le bien, sans <code>if/elif</code> à maintenir.", "code": "class Channel:\n    registry: dict[str, type] = {}\n\n    def __init_subclass__(cls, code, **kw):\n        super().__init_subclass__(**kw)\n        Channel.registry[code] = cls\n\nclass AlphaChannel(Channel, code=\"alpha\"):\n    ...\n\ndef connector_for(prop):\n    return Channel.registry[prop.channel]()"},
"Les métaclasses":{"ctx": "Les modèles Django sont créés par une métaclasse, <code>ModelBase</code> : à la définition de la classe, elle range les champs dans <code>_meta</code>, les remplace par des descripteurs et ajoute le manager <code>objects</code>.", "code": "from django.db import models\n\nclass Property(models.Model):\n    name = models.CharField(max_length=200)\n    nightly = models.PositiveIntegerField()\n\n# La métaclasse a déjà tout transformé :\ntype(Property)        # ModelBase\nProperty.name         # un descripteur\nProperty._meta.get_field(\"nightly\")\nProperty.objects.filter(nightly__lt=20000)"},
"Les annotations ne sont pas vérifiées à l'exécution":{"ctx": "FastAPI et pydantic lisent les annotations à l'exécution : ce sont elles qui valident le corps de la requête et renvoient une erreur 422 si une date manque ou est mal formée.", "code": "from datetime import date\nfrom fastapi import FastAPI\nfrom pydantic import BaseModel\napp = FastAPI()\nclass QuoteIn(BaseModel):\n    property_id: int\n    check_in: date\n    check_out: date\n    guests: int = 2\n\n@app.post(\"/quotes\")\ndef create_quote(body: QuoteIn):\n    return pricing.quote(body)  # validé"},
"Optional et None":{"ctx": "Dans un endpoint de prix, le code promo est facultatif ET peut valoir None ; le service de tarifs, lui, renvoie <code>Rate | None</code> quand aucun tarif ne couvre la date.", "code": "@app.get(\"/properties/{pid}/price\")\ndef price(pid: int, start: date, end: date,\n          promo: str | None = None):\n    rate = find_rate(pid, start)\n    if rate is None:\n        raise HTTPException(status_code=404)\n    return rate.total(start, end, promo)\n\ndef find_rate(pid: int,\n              day: date) -> Rate | None:\n    ..."},
"Protocol : le duck typing vérifié":{"ctx": "Le service de paiement dépend d'un <code>Protocol</code>, pas d'un SDK : le prestataire réel, un second prestataire ou un faux en test conviennent dès qu'ils ont les bonnes méthodes, sans héritage.", "code": "class PaymentProvider(Protocol):\n    def capture(self, intent: str,\n                cents: int) -> str: ...\n    def refund(self, charge: str,\n               cents: int) -> None: ...\n\nclass Payments:\n    def __init__(self, pp: PaymentProvider):\n        self.pp = pp\n\nclass FakeProvider:  # aucun héritage\n    def capture(self, intent, cents):\n        return \"ch_test\"\n    def refund(self, charge, cents): ..."},
"Classes abstraites : ABC":{"ctx": "La base des sources de calendrier impose la méthode à fournir et partage le reste : un connecteur incomplet échoue dès son instanciation au démarrage du worker, pas au premier appel en pleine nuit.", "code": "from abc import ABC, abstractmethod\n\nclass CalendarSource(ABC):\n    @abstractmethod\n    def fetch(self, p) -> list[Block]: ...\n\n    def sync(self, p):  # concrète, partagée\n        p.calendar.replace(self.fetch(p))\n\nclass IcalSource(CalendarSource):\n    def fetch(self, p):\n        return parse_ical(http_get(p.ical))"},
"Génériques et variance":{"ctx": "Un dépôt générique au-dessus de la session SQLAlchemy type une fois les accès communs : pour un <code>Repository[Booking]</code>, mypy sait que <code>get()</code> renvoie <code>Booking | None</code>.", "code": "from sqlalchemy.orm import Session\n\nclass Repository[T]:\n    def __init__(self, s: Session,\n                 model: type[T]):\n        self.s, self.model = s, model\n    def get(self, pk: int) -> T | None:\n        return self.s.get(self.model, pk)\n    def add(self, obj: T) -> None:\n        self.s.add(obj)\n\nbookings = Repository(session, Booking)\nb = bookings.get(42)  # Booking | None"},
"dataclasses":{"ctx": "Le séjour demandé est un value object : <code>frozen=True</code> le rend hachable, donc utilisable comme clé du cache de devis, et <code>replace(s, guests=4)</code> en produit une variante sans modifier l'original.", "code": "@dataclass(frozen=True)\nclass Stay:\n    start: date\n    end: date\n    guests: int = 2\n\n# lru_cache ignore les tarifs en base : la\n# version de la grille entre dans la clé\n@lru_cache(maxsize=4096)\ndef quote(pid, stay: Stay, grid_v: int):\n    return pricing_engine(pid, stay)\n\ns = Stay(D(\"2026-12-24\"), D(\"2026-12-31\"))\nquote(7, s, prop.grid_version)  # hachable"},
"Le GIL":{"ctx": "Le rafraîchissement nocturne interroge 40 partenaires en HTTP : des threads suffisent, car l'attente réseau relâche le GIL. Le rendu des factures PDF, du calcul pur, part dans des processus.", "code": "from concurrent.futures import (\n    ThreadPoolExecutor, ProcessPoolExecutor)\n\nwith ThreadPoolExecutor(16) as ex:  # I/O\n    feeds = list(ex.map(fetch_feed, ids))\n\nwith ProcessPoolExecutor() as ex:  # calcul\n    pdfs = list(ex.map(to_pdf, invoices))"},
"Le GIL ne rend pas votre code thread-safe":{"ctx": "Un worker multithread compte les synchronisations réussies par partenaire pour ses métriques : sans verrou, deux threads peuvent lire la même valeur et un incrément se perd.", "code": "class SyncStats:\n    def __init__(self):\n        self._lock = threading.Lock()\n        self._ok = Counter()\n    def success(self, partner):\n        with self._lock:  # lire + écrire\n            self._ok[partner] += 1\n    def snapshot(self):\n        with self._lock:\n            return dict(self._ok)"},
"asyncio : un seul thread, des coroutines":{"ctx": "Un endpoint FastAPI asynchrone interroge l'API d'un partenaire avec <code>httpx.AsyncClient</code> : pendant l'attente réseau, la boucle sert les autres requêtes, dans un seul thread.", "code": "# fermé (aclose) dans le lifespan\nclient = httpx.AsyncClient(\n    base_url=PARTNER_URL, timeout=5)\n\n@app.get(\"/properties/{pid}/availability\")\nasync def avail(pid: int, month: str):\n    # await : cède la main pendant l'attente\n    q = {\"month\": month}\n    r = await client.get(f\"/avail/{pid}\",\n                         params=q)\n    r.raise_for_status()\n    return r.json()"},
"Les tâches : create_task":{"ctx": "L'e-mail de confirmation ne doit pas retarder la réponse à la réservation : on le lance en tâche et on garde une référence, sinon la tâche peut être collectée en cours de route. Elle ne vit qu'en mémoire : un e-mail critique passe par une file durable.", "code": "_background: set[asyncio.Task] = set()\n\nasync def confirm(b):\n    await repo.mark_confirmed(b)\n    t = asyncio.create_task(send_email(b))\n    _background.add(t)  # référence forte\n    t.add_done_callback(_background.discard)\n    return b  # sans attendre l'e-mail\n\n# send_email journalise ses erreurs. Tâche\n# en mémoire : perdue si le processus\n# redémarre ; pour un e-mail critique, file\n# durable (Celery, table outbox)."},
"En séquence ou en concurrence":{"ctx": "La fiche d'un bien réunit tarif, calendrier et avis, servis par trois services : avec <code>gather</code>, la latence totale est celle du plus lent, et les avis indisponibles ne bloquent pas la page.", "code": "async def property_page(pid):\n    price, cal, revs = await asyncio.gather(\n        pricing.get(pid),\n        calendar.get(pid),\n        reviews.get(pid),\n        return_exceptions=True)\n    if isinstance(revs, Exception):\n        revs = []    # facultatifs\n    for res in (price, cal):\n        if isinstance(res, Exception):\n            raise res    # indispensables\n    return render(price, cal, revs)"},
"Ne jamais bloquer la boucle":{"ctx": "Le SDK de stockage des factures n'existe qu'en version synchrone : l'appeler tel quel dans une coroutine figerait toutes les requêtes du serveur, <code>asyncio.to_thread</code> le déporte dans un thread.", "code": "async def upload_invoice(b):\n    pdf = await render_pdf(b)\n    key = f\"invoices/{b.ref}.pdf\"\n    # Faux : fige la boucle pendant l'envoi\n    # storage.put(key, pdf)\n    await asyncio.to_thread(\n        storage.put, key, pdf)"},
"Outils de coordination":{"ctx": "Vérifier les disponibilités de 200 biens chez un partenaire limité à 10 requêtes simultanées : un <code>Semaphore</code> plafonne la concurrence, et le <code>TaskGroup</code> annule le reste si un appel échoue.", "code": "async def check_all(client, pids):\n    sem = asyncio.Semaphore(10)  # quota\n    async def one(pid):\n        url = f\"/avail/{pid}\"\n        async with sem:  # 10 au plus\n            r = await client.get(url)\n            r.raise_for_status()\n            return pid, r.json()\n    # échec : ExceptionGroup, à gérer\n    # par except*\n    async with asyncio.TaskGroup() as tg:\n        tasks = [tg.create_task(one(p))\n                 for p in pids]\n    return dict(t.result() for t in tasks)"},
"Annulation et délais":{"ctx": "Le devis affiché au voyageur ne doit pas attendre un partenaire lent : <code>asyncio.timeout</code> borne l'appel à 2 secondes, puis on se replie sur le dernier tarif en cache.", "code": "async def live_quote(pid, stay):\n    q = partner.quote(pid, stay)\n    try:\n        async with asyncio.timeout(2):\n            return await q\n    except TimeoutError:  # 3.11+\n        log.warning(\"lent : %s\", pid)\n        return cached_quote(pid, stay)\n    # CancelledError n'est pas interceptée :\n    # l'annulation reste possible"},
"Une variable est une référence":{"ctx": "Un cache de tarifs renvoyait sa liste interne : l'appelant qui la triait ou la filtrait en place modifiait le cache de tout le processus, puisque les deux noms désignent le même objet.", "code": "class RatesCache:\n    def __init__(self, loader):\n        self._load = loader\n        self._c: dict[int, list[Rate]] = {}\n    def rates(self, pid):\n        if pid not in self._c:\n            self._c[pid] = self._load(pid)\n        # Faux : return self._c[pid]\n        # l'appelant tiendrait le cache\n        return list(self._c[pid])  # copie"},
"Copie superficielle, copie profonde":{"ctx": "Chaque partenaire part d'une configuration par défaut imbriquée qu'il surcharge : avec une copie superficielle, les sous-dicts seraient partagés et le réglage d'un partenaire fuirait chez tous les autres.", "code": "DEFAULTS = {\n    \"timeout\": 10,\n    \"retry\": {\"times\": 3, \"on\": [502, 503]},\n}\n\ndef partner_config(over):\n    cfg = copy.deepcopy(DEFAULTS)\n    # copy.copy : cfg[\"retry\"] serait\n    # le dict de DEFAULTS, modifié ici\n    retry = over.get(\"retry\", {})\n    cfg[\"retry\"].update(retry)\n    if \"timeout\" in over:\n        cfg[\"timeout\"] = over[\"timeout\"]\n    return cfg"},
"La gestion de la mémoire":{"ctx": "Une table d'identité évite de charger deux fois le même bien pendant un traitement, sans le maintenir en vie : comme dans la session SQLAlchemy, l'entrée disparaît dès que plus rien ne référence l'objet.", "code": "from weakref import WeakValueDictionary\n\nclass PropertyLoader:\n    def __init__(self, db):\n        self.db = db\n        self._seen = WeakValueDictionary()\n    def get(self, pid):\n        prop = self._seen.get(pid)\n        if prop is None:\n            prop = self.db.load(pid)\n            self._seen[pid] = prop\n        return prop\n# compteur à zéro : l'entrée disparaît"},
"Complexités à connaître":{"ctx": "Vérifier qu'aucune nuit demandée n'est bloquée : avec les nuits bloquées dans un <code>set</code>, chaque test est en O(1) ; avec une liste, le contrôle de milliers de biens sur un an devient quadratique.", "code": "def nights(start, end):\n    n = (end - start).days\n    return (start + timedelta(d)\n            for d in range(n))\n\ndef is_free(blocked: set[date], a, b):\n    # O(1) par nuit grâce au hash\n    return blocked.isdisjoint(nights(a, b))\n\nblocked = set(prop.blocked_nights())"},
"Pièges numériques":{"ctx": "Les montants se calculent en <code>Decimal</code> et s'arrondissent explicitement : une taxe de 4,6 % sur un séjour de 1 234,50 euros doit tomber juste au centime, avec la règle d'arrondi choisie.", "code": "from decimal import Decimal, ROUND_HALF_UP\nCENT = Decimal(\"0.01\")\n\ndef tourist_tax(total: Decimal,\n                rate: Decimal) -> Decimal:\n    tax = total * rate / 100   # exact\n    # quantize arrondit par défaut au pair\n    return tax.quantize(CENT, ROUND_HALF_UP)\n\ntourist_tax(Decimal(\"1234.50\"),\n            Decimal(\"4.6\"))   # 56.79"},
"Itérables vides et ordre des dicts":{"ctx": "Le prix « à partir de » d'un bien est le minimum de ses tarifs futurs : pour un bien sans tarif publié, <code>min()</code> lèverait <code>ValueError</code> sans <code>default</code>.", "code": "def from_price(rates, today):\n    future = (r.cents for r in rates\n              if r.day >= today)\n    return min(future, default=None)\n\n# all([]) vaut True : sans le bool(),\n# une réservation sans paiement passerait\ndef fully_paid(pays):\n    return bool(pays) and all(\n        p.status == \"paid\" for p in pays)"},
"Optimiser avec méthode":{"ctx": "Avant de réécrire le calcul de prix jugé lent, on profile un appel réel : <code>cProfile</code> désigne la fonction qui coûte, puis <code>timeit</code> compare l'ancienne et la nouvelle version.", "code": "import cProfile, pstats, timeit\n\nwith cProfile.Profile() as prof:\n    quote(prop, stay)\npstats.Stats(prof).sort_stats(\n    \"cumulative\").print_stats(10)\n\nfor f in (quote, quote_v2):\n    t = timeit.timeit(lambda: f(prop, stay),\n                      number=1000)\n    print(f.__name__, round(t, 3), \"s\")"},
"Counter et defaultdict":{"ctx": "Le rapport hebdomadaire compte les réservations par canal de vente et regroupe les arrivées du samedi par bien, pour planifier le ménage.", "code": "from collections import Counter, defaultdict\n\nby_chan = Counter(b.channel for b in week)\nby_chan.most_common(3)\n# [('direct', 412), ('alpha', 260), ...]\n\narrivals = defaultdict(list)\nfor b in week:\n    if b.start.weekday() == 5:  # samedi\n        arrivals[b.prop_id].append(b.ref)"},
"deque et namedtuple":{"ctx": "Les webhooks d'un partenaire arrivent parfois en double : dans un processus, le worker garde les 1 000 derniers identifiants dans une <code>deque</code> bornée, doublée d'un <code>set</code> pour un test en O(1).", "code": "# un seul processus ; sinon Redis SET NX\nclass RecentIds:\n    def __init__(self, size=1000):\n        self.size = size\n        self._q = deque(maxlen=size)\n        self._ids = set()\n    def seen(self, eid) -> bool:\n        if eid in self._ids:\n            return True\n        if len(self._q) == self.size:\n            self._ids.discard(self._q[0])\n        self._q.append(eid)  # éjecte le 1er\n        self._ids.add(eid)\n        return False"},
"heapq : le tas":{"ctx": "Le tableau de bord de l'accueil montre les 20 prochaines arrivées parmi des dizaines de milliers de réservations : <code>nsmallest</code> évite de tout trier, et un tas sert de file de relances.", "code": "import heapq, itertools\n\nnext_20 = heapq.nsmallest(\n    20, upcoming, key=lambda b: b.arrival)\n\n# relances : (échéance, n°, tâche) ; le n°\n# évite de comparer deux tâches à égalité\nseq = itertools.count()\nqueue = []\nheapq.heappush(queue, (due, next(seq), job))\ndue, _, job = heapq.heappop(queue)  # 1re"},
"bisect : chercher dans une liste triée":{"ctx": "La grille tarifaire saisonnière d'un bien est une liste triée de dates de début : <code>bisect_right</code> trouve en O(log n) la saison qui contient une nuit donnée.", "code": "from bisect import bisect_right\n\n# début de chaque saison (trié) et prix\nSTARTS = [D(\"2026-01-01\"), D(\"2026-04-01\"),\n          D(\"2026-07-01\"), D(\"2026-09-01\")]\nPRICES = [9000, 12000, 18000, 11000]\n\ndef nightly_price(night: date) -> int:\n    i = bisect_right(STARTS, night) - 1\n    if i < 0:\n        raise ValueError(\"hors grille\")\n    return PRICES[i]"},
"Le système d'import":{"ctx": "Le client HTTP partagé est créé à la première importation du module, une fois par processus, et tous les connecteurs réutilisent son pool. Avec gunicorn <code>--preload</code> ou Celery prefork, il doit être importé après le fork : sinon les workers partagent ses sockets.", "code": "# partners/http.py\nimport httpx\nclient = httpx.Client(timeout=10)  # 1 fois\n# importé après le fork des workers\n\n# partners/alpha.py\nfrom partners.http import client\n\n# scripts/resync.py\ndef main(): ...\n\nif __name__ == \"__main__\":  # pas à l'import\n    main()"},
"Tests et assertions":{"ctx": "Le test métier central de la plateforme : réserver des dates qui chevauchent un séjour existant doit lever <code>Overbooking</code>, avec un message qui nomme la réservation en conflit.", "code": "def test_overlap_is_refused(cal):\n    cal.book(\"BK-1\", D(\"2026-12-24\"),\n             D(\"2026-12-31\"))\n    with pytest.raises(Overbooking) as exc:\n        cal.book(\"BK-2\", D(\"2026-12-30\"),\n                 D(\"2027-01-02\"))\n    assert \"BK-1\" in str(exc.value)"},
"Les fixtures":{"ctx": "Les tests du verrou de réservation utilisent une base Redis dédiée, vidée après chaque test même en cas d'échec ; la grille tarifaire, coûteuse à charger, est partagée par toute la session.", "code": "@pytest.fixture\ndef redis_db():\n    r = redis.Redis(db=15)   # base de test\n    yield r\n    r.flushdb()   # même si le test échoue\n@pytest.fixture(scope=\"session\")\ndef grid():   # chargée une seule fois\n    return load_grid(\"tests/data/grid.json\")\n\ndef test_lock_released(redis_db):\n    with pytest.raises(PaymentFailed):\n        with redis_lock(redis_db, \"bk:1\"):\n            raise PaymentFailed(\"BK-1\")\n    assert redis_db.get(\"bk:1\") is None"},
"parametrize":{"ctx": "Les frais de ménage dépendent de la durée du séjour, avec des effets de seuil : un test paramétré vérifie chaque cas limite, chacun avec son identifiant dans le rapport.", "code": "@pytest.mark.parametrize(\"nights, fee\", [\n    pytest.param(1, 8000, id=\"une-nuit\"),\n    pytest.param(6, 8000, id=\"6-nuits\"),\n    pytest.param(7, 6000, id=\"semaine\"),\n    pytest.param(28, 0, id=\"long-sejour\"),\n])\ndef test_cleaning_fee(nights, fee):\n    assert cleaning_fee(nights) == fee"},
"monkeypatch":{"ctx": "Le taux de remboursement dépend de la date du jour et d'un délai réglé par variable d'environnement : <code>monkeypatch</code> fixe les deux le temps du test, puis restaure tout.", "code": "def test_free_cancellation(monkeypatch):\n    # policies lit CANCEL_DAYS à l'appel\n    monkeypatch.setenv(\"CANCEL_DAYS\", \"14\")\n    today = D(\"2026-12-01\")\n    monkeypatch.setattr(policies, \"today\",\n                        lambda: today)\n    b = make_booking(start=D(\"2026-12-20\"))\n    assert policies.refund_rate(b) == 100"},
"mock.patch : patcher là où le nom est utilisé":{"ctx": "Le service de réservation importe le client de paiement par <code>from ... import</code> : le test patche donc <code>booking.services.gateway</code>, et non le module de paiement, pour qu'aucun vrai débit ne parte.", "code": "# booking/services.py\nfrom payments.client import gateway\n\n# tests/test_services.py\n@patch(\"booking.services.gateway\",\n       autospec=True)\ndef test_refund_on_cancel(gw):\n    gw.refund.return_value = \"re_1\"\n    cancel(booking_with_payment())\n    gw.refund.assert_called_once_with(\n        \"ch_1\", 25000)"}

const KEY="pyadv.v2", QPASS=4, QN=5, EXAM_X=4, EXAM_LEN=2*COURSES.length+EXAM_X, EXAM_PASS=Math.ceil(EXAM_LEN*.8), EXAM_MS=EXAM_LEN*90*1000, WEAK_N=10;
// Index des notions par titre, et identité de chaque question de quiz (cours, identifiant stable)
// Objets sans prototype : un identifiant venu du stockage ("constructor", "__proto__"...) n'y trouve rien
const NOTION=Object.create(null), ALLQ=Object.create(null);
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
COURSES.forEach((c,i)=>c.steps.forEach(s=>{ if(s.k==="n") NOTION[s.title]={s,c:i}; }));
QUIZ.forEach((z,i)=>z.forEach((q,j)=>{ q.c=i; q.id=i+"."+j; ALLQ[q.id]=q; }));
EXTRA.forEach((q,j)=>{ q.c=-1; q.id="x."+j; ALLQ[q.id]=q; });

const app=document.getElementById("app");
// exam : meilleur score avec son total {s, n} ; ex : examen en cours {q: identifiants tirés, p: réponses, t: début, x: XP}
const blank=()=>({c:{},xp:0,streak:0,last:null,exam:null,examN:0,w:{},lc:null,ex:null});
// Progression lue depuis localStorage : chaque champ est vérifié et ramené à une valeur sûre,
// quel que soit le contenu (null, mauvais type, tableau, ancien format).
const isObj=v=>v!==null&&typeof v==="object"&&!Array.isArray(v);
const int=(v,max,def)=>{ if(typeof v==="string"&&v.trim()!=="") v=Number(v); return typeof v==="number"&&Number.isInteger(v)&&v>=0&&v<=max?v:def; };
const num=(v,max,def)=>{ if(typeof v==="string"&&v.trim()!=="") v=Number(v); return typeof v==="number"&&Number.isFinite(v)&&v>=0&&v<=max?Math.round(v):def; };
function normalize(r){
  const S=blank(); if(!isObj(r)) return S;
  // c : objet indexé par cours ; un tableau (ancien format) est accepté
  const c=Array.isArray(r.c)?Object.assign({},r.c):isObj(r.c)?r.c:{};
  Object.keys(c).forEach(k=>{
    const i=/^(0|[1-9]\d*)$/.test(k)?int(k,COURSES.length-1,-1):-1, v=c[k]; if(i<0||!isObj(v)) return;   // "01", "1.0" : refusés
    const o={i:int(v.i,COURSES[i].steps.length,0),read:v.read===true,best:int(v.best,QN,null)};
    const n=int(v.n,1e6,null), m=int(v.m,COURSES[i].steps.length,null);
    if(n!=null) o.n=n; if(m!=null) o.m=m;
    S.c[i]=o;
  });
  S.xp=num(r.xp,1e9,0); S.streak=int(r.streak,1e6,0);
  S.last=typeof r.last==="string"&&r.last.length<=10?r.last:null;
  S.examN=int(r.examN,1e6,0);
  // Meilleur score d'examen : {s, n}. Ancien format entier : sur 24 si un examen a été passé avec cette version
  // (examN >= 1), sinon sur 20 (première version, sans examN).
  if(isObj(r.exam)){ const n=int(r.exam.n,100,0), s=int(r.exam.s,n,null); if(n&&s!=null) S.exam={s,n}; }
  else { const n=S.examN>=1?EXAM_LEN:20, s=int(r.exam,n,null); if(s!=null) S.exam={s,n}; }
  if(isObj(r.w)) Object.keys(r.w).forEach(id=>{ const v=int(r.w[id],1,0); if(has(ALLQ,id)) S.w[id]=v; });
  S.lc=int(r.lc,COURSES.length-1,null);
  const e=r.ex;
  if(isObj(e)&&Array.isArray(e.q)&&Array.isArray(e.p)&&e.q.length&&e.q.length<=EXAM_LEN&&e.p.length<=e.q.length
     &&e.q.every(id=>typeof id==="string"&&has(ALLQ,id))&&new Set(e.q).size===e.q.length
     &&e.p.every((v,k)=>typeof v==="string"&&ALLQ[e.q[k]].opts.includes(v))
     &&typeof e.t==="number"&&Number.isFinite(e.t)&&e.t>0&&e.t<=Date.now()+6e4)
    S.ex={q:e.q.slice(),p:e.p.slice(),t:e.t,x:int(e.x,1e6,0)};
  return S;
}
// Sauvegarde de secours : avant d'écraser une progression qui n'est pas exactement celle relue (JSON illisible,
// champs corrigés, ancien format), sa valeur brute est copiée dans pyadv.v2.backup (une fois par chargement).
const BKEY=KEY+".backup";
let S=blank(), NOTICE=null, kept=false;
const keep=raw=>{ if(kept||raw==null) return; kept=true; try{localStorage.setItem(BKEY,raw);}catch(e){} };
const canon=v=>Array.isArray(v)?"["+v.map(canon).join(",")+"]":isObj(v)?"{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+canon(v[k])).join(",")+"}":JSON.stringify(v);
const LOST="La progression enregistrée était illisible : l'app repart de zéro. Sa copie brute est conservée sur l'appareil (clé "+BKEY+").";
{ let raw=null; try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(raw!=null){
    try{ const r=JSON.parse(raw); S=normalize(r); if(canon(r)!==canon(S)) keep(raw); if(!isObj(r)) NOTICE=LOST; }
    catch(e){ S=blank(); keep(raw); NOTICE=LOST; }
  } }
// Après un rechargement sur un écran profond, l'entrée d'historique posée par l'app est encore là :
// l'accueil la retire (setBack(null) revient en arrière), pour qu'un seul retour quitte l'app.
try{ history.scrollRestoration="manual"; if(history.state&&!history.state.app) history.replaceState(null,""); }catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const el=(tag,cls,text)=>{const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e;};
const shuffle=a=>{a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
const btn=(label,fn,sec)=>{const b=el("button","btn"+(sec?" sec":""),label); b.onclick=fn; return b;};
const cs=i=>S.c[i]||(S.c[i]={i:0,read:false,best:null});
const passed=i=>cs(i).best!=null&&cs(i).best>=QPASS;
const day=off=>{const d=new Date(Date.now()-(off||0)*864e5); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();};
const streak=()=>(S.last===day()||S.last===day(1))?S.streak:0;
function gain(xp){S.xp+=xp; if(S.last!==day()){S.streak=S.last===day(1)?S.streak+1:1; S.last=day();} save();}
const weakIds=()=>Object.keys(S.w).filter(id=>has(ALLQ,id));
// Examen : réussi à partir de 80 % de son total ; score ramené au total actuel pour comparer
const examOk=e=>e!=null&&e.s>=Math.ceil(e.n*.8);
const onNow=e=>e?Math.ceil(e.s*EXAM_LEN/e.n):0;
const clock=ms=>{const s=Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const plural=(n,w)=>n+" "+w+(n>1?"s":"");

// Bouton retour d'Android : une entrée d'historique est posée dès qu'un écran a une action "retour".
// Sur l'accueil il n'y en a pas, et le retour quitte l'app.
let BACK=null, skipPop=0, TICK=null, COOL=0, TAP=0;
// Double tap : quand un tap (ou une validation au clavier) change l'écran ou le pied, les taps des 350 ms suivantes
// sont ignorés, pour que le second tap ne tombe pas sur le bouton apparu sous le doigt. À la souris, seul le
// second clic d'un double clic est ignoré.
const changed=()=>{ if(Date.now()-TAP<350) COOL=Date.now()+350; };
document.addEventListener("click",e=>{
  const now=Date.now(), stop=()=>{ e.stopPropagation(); e.preventDefault(); };
  if(e.pointerType==="mouse"){ if(e.detail>1) stop(); return; }
  if(now<COOL) return stop();
  TAP=now;
},true);
const pushHist=()=>{try{history.pushState({app:1},"");}catch(e){}};
function setBack(fn){
  BACK=fn||null;
  if(BACK){ if(!history.state) pushHist(); }
  else if(history.state&&history.state.app){ skipPop++; try{history.back();}catch(e){skipPop--;} }
}
window.addEventListener("popstate",()=>{
  if(skipPop){ skipPop--; if(BACK&&!history.state) pushHist(); return; }
  if(BACK){ const f=BACK; f(); }
});

// Écran = zone de contenu + pied collant. Le pied a deux parties : en haut, le retour (explication, chaîne)
// qui défile s'il est long ; en bas, les boutons, toujours visibles.
function setFoot(f,info,acts){
  const a=[]; if(info&&info.length){const x=el("div","fs"); x.append(...info); a.push(x);}
  const y=el("div","fa"); y.append(...acts); a.push(y);
  f.replaceChildren(...a); changed();
}
function screen(body,foot,onBack){
  if(TICK){clearInterval(TICK); TICK=null;}
  const b=el("div","body"); b.append(...body);
  const nodes=[b];
  if(foot){const f=el("div","foot"); setFoot(f,null,foot); nodes.push(f);}
  app.replaceChildren(...nodes); window.scrollTo(0,0); changed();
  setBack(onBack);
  return nodes[1];
}
// Restaure un écran sauvegardé (nœuds, retour, défilement)
function restore(saved,sb,sy){ app.replaceChildren(...saved); setBack(sb); window.scrollTo(0,sy); changed(); }
function top(exit,p,back,xLabel){
  const t=el("div","top"), x=el("button","x","✕"), b=el("div","bar"), i=el("i"), v=Math.round(p*100);
  x.setAttribute("aria-label",xLabel||"Fermer"); x.onclick=exit; i.style.width=v+"%"; b.append(i);
  b.setAttribute("role","progressbar"); b.setAttribute("aria-label","Progression");
  b.setAttribute("aria-valuemin","0"); b.setAttribute("aria-valuemax","100"); b.setAttribute("aria-valuenow",String(v));
  if(back){const a=el("button","x prev","‹"); a.setAttribute("aria-label","Étape précédente"); a.onclick=back; t.append(a);}
  t.append(b,x); return t;
}
function notionBody(s,tag){
  const d=el("div"), t=el("p"); t.innerHTML=s.html;
  d.append(el("div","tag",tag),el("h2",null,s.title),t);
  if(s.code) d.append(el("pre",null,s.code));
  // Cas d'usage en production : carte distincte sous la notion
  if(s.prod){
    const c=el("div","card prod"), x=el("p"); x.innerHTML=s.prod.ctx;
    c.append(el("div","tag","En production"),x,el("pre",null,s.prod.code)); d.append(c);
  }
  return d;
}
// Ouvre une notion en lecture par-dessus l'écran courant, puis le restaure tel quel
function showNotion(title){
  const n=NOTION[title]; if(!n) return;
  const saved=[...app.childNodes], sb=BACK, sy=window.scrollY;
  const close=()=>restore(saved,sb,sy);
  screen([notionBody(n.s,"Notion · Cours "+(n.c+1)+" · "+COURSES[n.c].title)],[btn("Retour",close)],close);
}
// Chaîne d'appel : ce que Python exécute réellement, affichée sous l'explication
const chainBox=s=>{ if(!s.chain) return []; const d=el("div","chain"); d.append(el("div","tag","Chaîne d'appel"),el("pre",null,s.chain)); return [d]; };
const reviewBtn=ref=>{const b=btn("Revoir la notion",()=>showNotion(ref),true); return b;};

function home(){
  const body=[el("h1",null,"Python avancé")], pills=el("div","pills");
  pills.append(el("span","pill","Série : "+streak()+" j"),el("span","pill",S.xp+" XP"),el("span","pill",COURSES.filter((c,i)=>passed(i)).length+"/"+COURSES.length+" validés"));
  body.push(pills);
  if(NOTICE){
    const n=el("div","card notice"), ok=btn("Compris",()=>{NOTICE=null; home();},true);
    n.append(el("div","tag","Progression"),el("p",null,NOTICE),ok); body.push(n);
  }
  if(S.ex){
    const left=S.ex.t+EXAM_MS-Date.now(), x=el("button","card exam-run");
    x.append(el("div","tag","Examen blanc en cours"),el("div","t","Reprendre l'examen"),
      el("div","mut","Question "+Math.min(S.ex.p.length+1,S.ex.q.length)+"/"+S.ex.q.length+" · "+(left>0?clock(left)+" restantes":"temps écoulé")));
    x.onclick=()=>exam(S.ex); body.push(x);
  }
  const nw=weakIds().length;
  if(nw){
    const w=el("button","card weak");
    w.append(el("div","tag","Révision ciblée"),el("div","t","Points faibles ("+plural(nw,"question")+")"),el("div","mut","Reprendre les questions ratées en quiz et en examen"));
    w.onclick=weakSession; body.push(w);
  }
  const path=el("div","path"), cur=COURSES.findIndex((c,i)=>!passed(i)), shift=[0,36,72,36];
  const stop=(label,title,sub,cls,k,fn)=>{
    const b=el("button","stop "+cls), g=el("div");
    b.style.paddingLeft=shift[k%4]+"px";
    g.append(el("div","t",title),el("div","mut",sub)); b.append(el("div","node",label),g); b.onclick=fn; path.append(b);
  };
  COURSES.forEach((c,i)=>{
    const st=cs(i);
    const sub=passed(i)?"Validé, quiz "+st.best+"/"+QN:st.best!=null?"Quiz à repasser ("+st.best+"/"+QN+")":st.read?"Leçon terminée, quiz à passer":st.i?"Leçon en cours":c.sub;
    stop(String(i+1),c.title,sub,passed(i)?"done":i===cur?"cur":"",i,()=>coursePage(i));
  });
  stop("E","Examen blanc",S.ex?"En cours":S.exam!=null?"Meilleur score "+S.exam.s+"/"+S.exam.n:EXAM_LEN+" questions, "+EXAM_MS/60000+" min, sans correction avant la fin",examOk(S.exam)?"done":cur<0?"cur":"",COURSES.length,examIntro);
  body.push(path);
  const f=el("p","small"), rb=el("button",null,"Réinitialiser la progression");
  rb.onclick=()=>{ if(rb.dataset.sure){S=blank();save();home();} else {rb.dataset.sure=1; rb.textContent="Confirmer la réinitialisation";} };
  f.append(rb); body.push(f);
  // Leçon en cours : reprise en un appui
  let lc=S.lc!=null&&COURSES[S.lc]&&cs(S.lc).i>0?S.lc:COURSES.findIndex((c,i)=>cs(i).i>0);
  screen(body,lc>=0?[btn("Reprendre : "+COURSES[lc].title,()=>lesson(lc))]:null);
  const c=path.querySelector(".cur"); if(c&&c.scrollIntoView) c.scrollIntoView({block:"center"});
}

function coursePage(ci){
  const c=COURSES[ci], st=cs(ci), nq=c.steps.filter(s=>s.k==="q").length;
  const l=el("div","card"), q=el("div","card");
  l.append(el("div","tag","Leçon"),el("div","t",plural(nq,"exercice")+" guidé"+(nq>1?"s":"")),el("div","mut",st.read&&!st.i?"Terminée":st.i?"En cours : étape "+(st.i+1)+"/"+c.steps.length:"Notions courtes, on vérifie et on réessaie"),
    btn(st.i?"Reprendre":st.read?"Revoir la leçon":"Commencer",()=>lesson(ci),st.read&&!st.i));
  q.append(el("div","tag","Quiz du cours"),el("div","t",QN+" questions tirées parmi "+QUIZ[ci].length),
    el("div","mut",st.best!=null?"Meilleur score : "+st.best+"/"+QN+" · "+plural(st.n||1,"tentative"):"Validé à partir de "+QPASS+"/"+QN+", sans seconde chance"),
    btn(st.best!=null?"Repasser le quiz":"Passer le quiz",()=>courseQuiz(ci),!st.read||passed(ci)));
  if(!st.read) q.append(el("div","mut hint","Conseillé après la leçon"));
  screen([top(home,passed(ci)?1:st.read?.6:st.i/c.steps.length*.6,null,"Retour au parcours"),el("div","tag","Cours "+(ci+1)),el("h2",null,c.title),el("p","mut",c.sub),l,q],null,home);
}

// Affiche une question.
// o.mode : learn (on peut réessayer), quiz (correction immédiate), exam (aucune correction)
function ask(s,o){
  const card=el("div"), tagEl=el("div","tag",o.tag), h=el("h2",null,s.q);
  let pick=null, tries=0, retry=null; const blanks=[];
  h.id="q"; card.append(tagEl,h);
  if(s.code){
    const pre=el("pre"), parts=s.code.split("____");
    parts.forEach((t,k)=>{pre.append(t); if(k<parts.length-1){const b=el("span","blank","____"); blanks.push(b); pre.append(b);}});
    card.append(pre);
  }
  const setBlank=v=>blanks.forEach(b=>{b.textContent=v||"____"; b.classList.toggle("on",!!v);});
  const check=btn(o.label||"Vérifier",onCheck); check.disabled=true;
  const mark=b=>opts.forEach(x=>{const on=x===b; x.classList.toggle("sel",on); x.setAttribute("aria-checked",String(on));});
  const opts=shuffle(s.opts).map(v=>{
    const b=el("button","opt",v);
    b.setAttribute("role","radio"); b.setAttribute("aria-checked","false");
    // Après une erreur en leçon, toucher une autre réponse relance directement l'essai
    b.onclick=()=>{ if(retry) retry(); pick=v; mark(b); setBlank(v); check.disabled=false; };
    return b;
  });
  const box=el("div",blanks.length?"chips":s.q===OUT?"mono":null);
  box.setAttribute("role","radiogroup"); box.setAttribute("aria-labelledby","q");
  box.append(...opts); card.append(box);
  let base=check;
  if(o.back){base=el("div","rowb"); base.append(btn("Précédent",o.back,true),check);}
  const foot=screen([top(o.exit,o.p,o.back),card],[base],o.onBack||o.exit);
  if(o.deadline){
    const upd=()=>{ const r=o.deadline-Date.now(); if(r<=0) return o.onTimeout(); tagEl.textContent=o.tag+" · "+clock(r); };
    upd(); if(o.deadline>Date.now()) TICK=setInterval(upd,500);
  }
  // Fait défiler pour que la bonne réponse reste visible au-dessus du pied collant
  const showGood=()=>requestAnimationFrame(()=>{
    const g=box.querySelector(".good"); if(!g) return;
    const r=g.getBoundingClientRect(), ft=foot.getBoundingClientRect().top;
    if(r.bottom>ft-12) window.scrollBy({top:r.bottom-ft+12,behavior:"smooth"});
    else if(r.top<0) window.scrollBy({top:r.top-12,behavior:"smooth"});
  });
  function onCheck(){
    const good=pick===s.opts[0], cur=opts.find(x=>x.textContent===pick);
    if(o.onCheck) o.onCheck(good,pick);
    if(o.mode==="exam") return o.cb();
    tries++; cur.classList.remove("sel");
    const fb=el("div","fb "+(good?"g":"b")), cont=btn("Continuer",()=>o.cb(good&&tries===1));
    fb.setAttribute("role","status");
    fb.append(el("div","t",good?(tries===1?"Correct !":"Correct, bien rattrapé."):"Pas tout à fait."));
    const reveal=()=>{
      retry=null;
      opts.forEach(x=>{x.disabled=true; if(x.textContent===s.opts[0])x.classList.add("good");});
      setBlank(s.opts[0]); fb.append(el("div","why",s.why),...chainBox(s));
      const extra=!good&&o.review&&NOTION[s.ref]?[reviewBtn(s.ref)]:[];
      setFoot(foot,[fb],[cont,...extra]); cont.focus({preventScroll:true}); showGood();
    };
    if(good) return reveal();
    cur.classList.add("bad"); cur.disabled=true; cur.setAttribute("aria-checked","false");
    if(o.mode==="quiz") return reveal();
    check.disabled=true; pick=null;
    retry=()=>{ retry=null; setBlank(""); setFoot(foot,null,[base]); };
    setFoot(foot,[fb],[btn("Réessayer",()=>retry()),
      btn("Voir l'explication",()=>{fb.className="fb"; fb.replaceChildren(el("div","t","Explication")); reveal();},true)]);
  }
}

function lesson(ci){
  const c=COURSES[ci], st=cs(ci), exit=()=>coursePage(ci);
  S.lc=ci;
  if(st.i>=c.steps.length){
    const first=!st.read;
    st.i=0; st.read=true; gain(first?20:0);
    const d=el("div","center"); d.append(el("div","tag","Leçon terminée"),el("h2",null,c.title));
    if(first) d.append(el("div","big okc","+20 XP"));
    d.append(el("p","mut","Place au quiz du cours : "+QN+" questions tirées parmi "+QUIZ[ci].length+", sans seconde chance."));
    return screen([d],[btn("Passer le quiz",()=>courseQuiz(ci)),btn("Plus tard",home,true)],home);
  }
  const s=c.steps[st.i], n=c.steps.length, p=st.i/n, pos=" · "+(st.i+1)+"/"+n;
  const next=()=>{st.i++; save(); lesson(ci);};
  const back=st.i>0?()=>{st.i--; save(); lesson(ci);}:null;
  // XP accordé une seule fois par exercice : ni en revenant en arrière, ni en relisant la leçon
  if(s.k==="q") return ask(s,{mode:"learn",tag:"Exercice"+pos,exit,p,back,onBack:back||exit,
    cb:first=>{ if(!st.read&&st.i>=(st.m||0)){st.m=st.i+1; gain(first?10:5);} next(); }});
  let foot=btn("Continuer",next);
  if(back){const r=el("div","rowb"); r.append(btn("Précédent",back,true),foot); foot=r;}
  screen([top(exit,p,back),notionBody(s,"Notion"+pos)],[foot],back||exit);
}

// Déroule une série de questions. o.record(res) est appelé après chaque réponse :
// la tentative est donc comptée dès la première réponse, même en cas d'abandon.
// o.res0 : réponses déjà données (reprise d'un examen).
function run(qs,o){
  const res=(o.res0||[]).slice(); let i=res.length, shown=false;
  const finish=()=>o.done(res);
  // Confirmation d'abandon. "Continuer" (ou le retour) ramène à l'écran quitté : la correction affichée
  // si la question vient d'être corrigée, sinon la question en cours.
  const quit=()=>{
    if(!res.length) return o.exit();
    const saved=[...app.childNodes], sb=BACK, sy=window.scrollY;
    const resume=shown?()=>restore(saved,sb,sy):step;
    const d=el("div","center");
    d.append(el("div","tag",o.name),el("h2",null,"Abandonner ?"),el("p","mut",o.msg||"La tentative est déjà comptée, avec le score obtenu jusqu'ici."));
    screen([d],[btn(o.again,resume),btn("Abandonner",o.exit,true)],resume);
  };
  function step(){
    shown=false;
    if(i>=qs.length||(o.deadline&&Date.now()>=o.deadline)) return finish();
    const last=i===qs.length-1, q=qs[i];
    ask(q,{mode:o.mode,tag:"Question "+(i+1)+"/"+qs.length,exit:quit,onBack:quit,p:(i+1)/qs.length,review:o.review,
      deadline:o.deadline,onTimeout:finish,label:o.mode==="exam"?(last?"Terminer l'examen":"Valider"):null,
      onCheck:(ok,pick)=>{ res.push({s:q,ok,pick}); i++; shown=o.mode!=="exam"; if(o.record) o.record(res); },cb:step});
  }
  step();
}
// Points faibles : une question ratée entre dans la liste, elle en sort après deux réussites de suite en révision
const missed=r=>{ if(!r.ok) S.w[r.s.id]=0; };

function courseQuiz(ci){
  const c=COURSES[ci], st=cs(ci), val=n=>n*10+(n>=QPASS?20:0); let xp=0;
  run(shuffle(QUIZ[ci]).slice(0,QN),{mode:"quiz",name:"Quiz : "+c.title,again:"Continuer le quiz",review:true,exit:()=>coursePage(ci),
    record:res=>{
      const score=res.filter(r=>r.ok).length;
      if(res.length===1) st.n=(st.n||0)+1;
      missed(res[res.length-1]);
      // XP : seulement l'écart avec le meilleur score précédent
      let g=0; if(st.best==null||score>st.best){ g=val(score)-val(st.best||0); st.best=score; }
      xp+=g; gain(g);
    },
    done:res=>{
      const score=res.filter(r=>r.ok).length, ok=score>=QPASS;
      const d=el("div","center");
      d.append(el("div","tag","Quiz : "+c.title),el("div","big "+(ok?"okc":"koc"),score+"/"+QN),el("h2",null,ok?"Cours validé":"Encore un effort"));
      const info=(ok?"":"Il faut "+QPASS+"/"+QN+" pour valider. La prochaine tentative tirera d'autres questions. ")+(xp>0?"+"+xp+" XP":"");
      if(info) d.append(el("p","mut",info));
      const foot=[];
      if(ok) foot.push(ci+1<COURSES.length?btn("Cours suivant",()=>coursePage(ci+1)):btn("Passer l'examen blanc",examIntro));
      else foot.push(btn("Repasser le quiz",()=>courseQuiz(ci)),btn("Revoir la leçon",()=>lesson(ci),true));
      foot.push(btn("Retour au parcours",home,true));
      screen([d],foot,home);
    }});
}

function weakSession(){
  const qs=shuffle(weakIds()).slice(0,WEAK_N).map(id=>ALLQ[id]); let xp=0;
  if(!qs.length) return home();
  run(qs,{mode:"quiz",name:"Points faibles",again:"Continuer la révision",review:true,exit:home,msg:"Les réponses déjà données restent enregistrées.",
    record:res=>{
      const r=res[res.length-1], id=r.s.id;
      if(!r.ok) S.w[id]=0;
      else { S.w[id]=(S.w[id]||0)+1; if(S.w[id]>=2) delete S.w[id]; xp+=2; }
      gain(r.ok?2:0);
    },
    done:res=>{
      const score=res.filter(r=>r.ok).length, left=weakIds().length, d=el("div","center");
      d.append(el("div","tag","Points faibles"),el("div","big "+(score===res.length?"okc":""),score+"/"+res.length),
        el("h2",null,left?"Encore "+plural(left,"question")+" à consolider":"Liste vidée, bravo"),
        el("p","mut","Une question sort de la liste après deux bonnes réponses de suite."+(xp>0?" +"+xp+" XP":"")));
      const foot=[]; if(left) foot.push(btn("Continuer la révision",weakSession));
      foot.push(btn("Retour au parcours",home,!!left));
      screen([d],foot,home);
    }});
}

const bestTxt=()=>"Meilleur score : "+S.exam.s+"/"+S.exam.n+(S.exam.n!==EXAM_LEN?" (ancien examen sur "+S.exam.n+" questions)":"")+" · "+plural(S.examN||1,"tentative");
function examIntro(){
  const d=el("div","center");
  d.append(el("div","tag","Examen blanc"),el("h2",null,EXAM_LEN+" questions, "+EXAM_MS/60000+" minutes"));
  // Un examen est déjà en cours : on le reprend (le chronomètre a continué)
  if(S.ex){
    const left=S.ex.t+EXAM_MS-Date.now();
    d.append(el("p",null,"Examen en cours : "+S.ex.p.length+" réponse"+(S.ex.p.length>1?"s":"")+" sur "+S.ex.q.length+", "+(left>0?clock(left)+" restantes.":"temps écoulé.")));
    return screen([d],[btn("Reprendre l'examen",()=>exam(S.ex)),btn("Retour au parcours",home,true)],home);
  }
  d.append(el("p",null,"2 questions par cours et "+EXAM_X+" pièges généraux. Aucune correction avant la fin."),
    el("p","mut","Le chronomètre démarre maintenant et ne s'arrête pas, même si vous quittez l'app. À zéro, les questions sans réponse comptent comme fausses. Seuil de réussite : "+EXAM_PASS+"/"+EXAM_LEN+"."));
  if(S.exam!=null) d.append(el("p","mut",bestTxt()));
  screen([d],[btn("Commencer l'examen",()=>exam()),btn("Retour au parcours",home,true)],home);
}

// Examen blanc. L'examen en cours (questions tirées, réponses, heure de début) est enregistré à chaque réponse :
// après un rechargement ou une sortie, il se reprend tant que le temps n'est pas écoulé, et se termine
// avec les réponses données sinon. saved : examen enregistré à reprendre.
function exam(saved){
  // 2 questions par cours et quelques pièges généraux, dans un ordre mélangé
  const qs=saved?saved.q.map(id=>ALLQ[id]):shuffle(QUIZ.flatMap(z=>shuffle(z).slice(0,2)).concat(shuffle(EXTRA).slice(0,EXAM_X)));
  const start=saved?saved.t:Date.now(), deadline=start+EXAM_MS;
  const res0=saved?saved.p.map((pick,k)=>({s:qs[k],ok:pick===qs[k].opts[0],pick})):[];
  S.ex={q:qs.map(q=>q.id),p:res0.map(r=>r.pick),t:start,x:saved?saved.x:0}; save();
  const end=()=>{ const x=S.ex?S.ex.x:0; S.ex=null; save(); return x; };
  run(qs,{mode:"exam",name:"Examen blanc",again:"Continuer l'examen",exit:()=>{end(); home();},deadline,res0,
    record:res=>{
      const score=res.filter(r=>r.ok).length;
      if(res.length===1) S.examN=(S.examN||0)+1;
      missed(res[res.length-1]);
      let g=0; if(S.exam==null||score*S.exam.n>S.exam.s*EXAM_LEN){ g=Math.max(0,score-onNow(S.exam))*5; S.exam={s:score,n:EXAM_LEN}; }
      if(S.ex){ S.ex.p=res.map(r=>r.pick); S.ex.x+=g; }
      gain(g); save();
    },
    done:res=>{
      const xp=end();
      const used=Math.min(Date.now(),deadline)-start, late=Date.now()>=deadline&&res.length<qs.length;
      const score=res.filter(r=>r.ok).length, ok=score>=EXAM_PASS, skipped=qs.slice(res.length);
      const d=el("div","center"), sec=Math.round(used/1000);
      d.append(el("div","tag","Examen blanc"),el("div","big "+(ok?"okc":"koc"),score+"/"+qs.length),
        el("h2",null,late?"Temps écoulé":ok?"Seuil atteint":"Seuil non atteint"),
        el("p","mut","Temps : "+Math.floor(sec/60)+" min "+String(sec%60).padStart(2,"0")+" s sur "+EXAM_MS/60000+" min. Seuil : "+EXAM_PASS+"/"+qs.length+"."+(xp>0?" +"+xp+" XP":"")));
      const body=[d], sc=el("div","card");
      sc.append(el("div","tag","Score par cours"));
      COURSES.map((c,i)=>[(i+1)+". "+c.title,i]).concat([["Pièges généraux",-1]]).forEach(([name,k])=>{
        const all=qs.filter(q=>q.c===k).length, n=res.filter(r=>r.s.c===k&&r.ok).length, row=el("div","sc");
        row.append(el("span",null,name),el("b",n===all?"okc":n?null:"koc",n+"/"+all)); sc.append(row);
      });
      body.push(sc);
      const lab=(cls,l,txt,mono)=>{const o=el("div","opt "+cls+(mono?" mono":"")); o.append(el("span","lab",l),txt); return o;};
      const errCard=(q,pick)=>{
        const c=el("div","card err"); c.append(el("div","t",q.q));
        if(q.code) c.append(el("pre",null,q.code));
        const mono=q.q===OUT;
        c.append(pick==null?lab("bad","Votre réponse :","Sans réponse (temps écoulé)"):lab("bad","Votre réponse :",pick,mono),lab("good","Bonne réponse :",q.opts[0],mono));
        const w=el("div","why",q.why); w.style.marginTop="12px"; c.append(w,...chainBox(q));
        if(NOTION[q.ref]){const b=reviewBtn(q.ref); b.className="btn link"; c.append(b);}
        body.push(c);
      };
      res.filter(r=>!r.ok).forEach(r=>errCard(r.s,r.pick));
      skipped.forEach(q=>{ S.w[q.id]=0; errCard(q,null); });
      save();
      screen(body,[btn("Refaire un examen",examIntro),btn("Retour au parcours",home,true)],home);
    }});
}
// Premier écran : l'accueil, ou le résultat d'un examen dont le temps s'est écoulé app fermée.
// Dernier recours : si cet écran ne peut pas se construire avec la progression lue, sa valeur brute est
// copiée dans pyadv.v2.backup, l'utilisateur est prévenu, et l'app repart de zéro.
function start(){ if(S.ex&&Date.now()>=S.ex.t+EXAM_MS) return exam(S.ex); home(); }
try{ start(); }catch(e){ try{ keep(localStorage.getItem(KEY)); }catch(_){} S=blank(); NOTICE=LOST; save(); home(); }
})();
