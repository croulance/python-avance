Q("a.py commence par import b, puis définit f. b.py contient from a import f. Que se passe-t-il quand un script fait import a ?",null,["ImportError dans b : a est partiellement initialisé, f n'existe pas encore","Tout fonctionne : Python résout les cycles automatiquement","RecursionError : les deux imports s'appellent sans fin","ModuleNotFoundError : a est introuvable depuis b"],"Quand b s'exécute, a est déjà dans sys.modules mais son code s'est arrêté à la ligne import b : f n'est pas encore défini. Il n'y a pas de boucle infinie, justement parce que a est déjà enregistré. Un simple import a dans b aurait fonctionné."),
Q("tool.py contient uniquement print(__name__). Qu'affiche python tool.py, puis qu'affiche import tool depuis un autre script ?",null,["__main__ puis tool","tool puis __main__","__main__ dans les deux cas","tool dans les deux cas"],"Le fichier lancé directement reçoit le nom spécial __main__. Importé, un module porte son propre nom. C'est ce qui permet au garde if __name__ == '__main__' de distinguer les deux situations."),
]},
{title:"Tests avec pytest",sub:"Fixtures, parametrize, monkeypatch, mock",steps:[
N("Tests et assertions","pytest collecte les fonctions <code>test_*</code> des fichiers <code>test_*.py</code> et s'appuie sur le simple <code>assert</code> : en cas d'échec, il affiche les valeurs comparées. Pour vérifier qu'une exception est levée, on utilise <code>pytest.raises</code> comme context manager : le test <b>échoue</b> si le bloc ne lève pas l'exception attendue, ou s'il en lève une autre. L'objet lié par <code>as</code> donne accès à l'exception levée via <code>.value</code> (l'instance ; <code>.type</code> est sa classe), et <code>match=</code> contrôle son message avec une expression régulière.",
`import pytest

def test_division():
    assert 6 / 3 == 2

def test_zero():
    with pytest.raises(ZeroDivisionError):
        1 / 0

def test_message():
    with pytest.raises(ValueError) as exc:
        int("x")
    assert "invalid" in str(exc.value)`),
Q("Quel est le résultat de ce test ?",
`import pytest

def test_get():

const KEY="pyadv.v2", QPASS=4, QN=5, EXAM_X=4, EXAM_LEN=2*COURSES.length+EXAM_X, EXAM_PASS=Math.ceil(EXAM_LEN*.8), EXAM_MS=EXAM_LEN*90*1000, WEAK_N=10;
// Index des notions par titre, et identité de chaque question de quiz (cours, identifiant stable)
const NOTION={}, ALLQ={};
COURSES.forEach((c,i)=>c.steps.forEach(s=>{ if(s.k==="n") NOTION[s.title]={s,c:i}; }));
QUIZ.forEach((z,i)=>z.forEach((q,j)=>{ q.c=i; q.id=i+"."+j; ALLQ[q.id]=q; }));
EXTRA.forEach((q,j)=>{ q.c=-1; q.id="x."+j; ALLQ[q.id]=q; });

const app=document.getElementById("app");
const blank=()=>({c:{},xp:0,streak:0,last:null,exam:null,examN:0,w:{},lc:null});
let S=blank();
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
if(!S.w||typeof S.w!=="object") S.w={};
// Après un rechargement, on repart d'une entrée d'historique neutre
try{ history.scrollRestoration="manual"; if(history.state) history.replaceState(null,""); }catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const el=(tag,cls,text)=>{const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e;};
const shuffle=a=>{a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
const btn=(label,fn,sec)=>{const b=el("button","btn"+(sec?" sec":""),label); b.onclick=fn; return b;};
const cs=i=>S.c[i]||(S.c[i]={i:0,read:false,best:null});
const passed=i=>cs(i).best!=null&&cs(i).best>=QPASS;
const day=off=>{const d=new Date(Date.now()-(off||0)*864e5); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();};
const streak=()=>(S.last===day()||S.last===day(1))?S.streak:0;
function gain(xp){S.xp+=xp; if(S.last!==day()){S.streak=S.last===day(1)?S.streak+1:1; S.last=day();} save();}
const weakIds=()=>Object.keys(S.w).filter(id=>ALLQ[id]);
const clock=ms=>{const s=Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const plural=(n,w)=>n+" "+w+(n>1?"s":"");

// Bouton retour d'Android : une entrée d'historique est posée dès qu'un écran a une action "retour".
// Sur l'accueil il n'y en a pas, et le retour quitte l'app.
let BACK=null, skipPop=0, TICK=null;
const pushHist=()=>{try{history.pushState({app:1},"");}catch(e){}};
function setBack(fn){
  BACK=fn||null;
  if(BACK){ if(!history.state) pushHist(); }
  else if(history.state&&history.state.app){ skipPop++; try{history.back();}catch(e){skipPop--;} }
}
window.addEventListener("popstate",()=>{
  if(skipPop){ skipPop--; if(BACK&&!history.state) pushHist(); return; }
  if(BACK){ const f=BACK; f(); }
});

// Écran = zone de contenu + pied collant
function screen(body,foot,onBack){
  if(TICK){clearInterval(TICK); TICK=null;}
  const b=el("div","body"); b.append(...body);
  const nodes=[b];
  if(foot){const f=el("div","foot"); f.append(...foot); nodes.push(f);}
  app.replaceChildren(...nodes); window.scrollTo(0,0);
  setBack(onBack);
  return nodes[1];
}
function top(exit,p,back,xLabel){
  const t=el("div","top"), x=el("button","x","✕"), b=el("div","bar"), i=el("i"), v=Math.round(p*100);
  x.setAttribute("aria-label",xLabel||"Fermer"); x.onclick=exit; i.style.width=v+"%"; b.append(i);
  b.setAttribute("role","progressbar"); b.setAttribute("aria-label","Progression");
  b.setAttribute("aria-valuemin","0"); b.setAttribute("aria-valuemax","100"); b.setAttribute("aria-valuenow",String(v));
  if(back){const a=el("button","x prev","‹"); a.setAttribute("aria-label","Étape précédente"); a.onclick=back; t.append(a);}
  t.append(b,x); return t;
}
function notionBody(s,tag){
  const d=el("div"), t=el("p"); t.innerHTML=s.html;
  d.append(el("div","tag",tag),el("h2",null,s.title),t);
  if(s.code) d.append(el("pre",null,s.code));
  return d;
}
// Ouvre une notion en lecture par-dessus l'écran courant, puis le restaure tel quel
function showNotion(title){
  const n=NOTION[title]; if(!n) return;
  const saved=[...app.childNodes], sb=BACK, sy=window.scrollY;
  const close=()=>{ app.replaceChildren(...saved); setBack(sb); window.scrollTo(0,sy); };
  screen([notionBody(n.s,"Notion · Cours "+(n.c+1)+" · "+COURSES[n.c].title)],[btn("Retour",close)],close);
}
const reviewBtn=ref=>{const b=btn("Revoir la notion",()=>showNotion(ref),true); return b;};

function home(){
  const body=[el("h1",null,"Python avancé")], pills=el("div","pills");
  pills.append(el("span","pill","Série : "+streak()+" j"),el("span","pill",S.xp+" XP"),el("span","pill",COURSES.filter((c,i)=>passed(i)).length+"/"+COURSES.length+" validés"));
  body.push(pills);
  const nw=weakIds().length;
  if(nw){
    const w=el("button","card weak");
    w.append(el("div","tag","Révision ciblée"),el("div","t","Points faibles ("+plural(nw,"question")+")"),el("div","mut","Reprendre les questions ratées en quiz et en examen"));
    w.onclick=weakSession; body.push(w);
  }
  const path=el("div","path"), cur=COURSES.findIndex((c,i)=>!passed(i)), shift=[0,36,72,36];
  const stop=(label,title,sub,cls,k,fn)=>{
    const b=el("button","stop "+cls), g=el("div");
    b.style.paddingLeft=shift[k%4]+"px";
    g.append(el("div","t",title),el("div","mut",sub)); b.append(el("div","node",label),g); b.onclick=fn; path.append(b);
  };
  COURSES.forEach((c,i)=>{
    const st=cs(i);
    const sub=passed(i)?"Validé, quiz "+st.best+"/"+QN:st.best!=null?"Quiz à repasser ("+st.best+"/"+QN+")":st.read?"Leçon terminée, quiz à passer":st.i?"Leçon en cours":c.sub;
    stop(String(i+1),c.title,sub,passed(i)?"done":i===cur?"cur":"",i,()=>coursePage(i));
  });
  stop("E","Examen blanc",S.exam!=null?"Meilleur score "+S.exam+"/"+EXAM_LEN:EXAM_LEN+" questions, "+EXAM_MS/60000+" min, sans correction avant la fin",S.exam>=EXAM_PASS?"done":cur<0?"cur":"",COURSES.length,examIntro);
  body.push(path);
  const f=el("p","small"), rb=el("button",null,"Réinitialiser la progression");
  rb.onclick=()=>{ if(rb.dataset.sure){S=blank();save();home();} else {rb.dataset.sure=1; rb.textContent="Confirmer la réinitialisation";} };
  f.append(rb); body.push(f);
  // Leçon en cours : reprise en un appui
  let lc=S.lc!=null&&COURSES[S.lc]&&cs(S.lc).i>0?S.lc:COURSES.findIndex((c,i)=>cs(i).i>0);
  screen(body,lc>=0?[btn("Reprendre : "+COURSES[lc].title,()=>lesson(lc))]:null);
  const c=path.querySelector(".cur"); if(c&&c.scrollIntoView) c.scrollIntoView({block:"center"});
}

function coursePage(ci){
  const c=COURSES[ci], st=cs(ci), nq=c.steps.filter(s=>s.k==="q").length;
  const l=el("div","card"), q=el("div","card");
  l.append(el("div","tag","Leçon"),el("div","t",plural(nq,"exercice")+" guidé"+(nq>1?"s":"")),el("div","mut",st.read&&!st.i?"Terminée":st.i?"En cours : étape "+(st.i+1)+"/"+c.steps.length:"Notions courtes, on vérifie et on réessaie"),
    btn(st.i?"Reprendre":st.read?"Revoir la leçon":"Commencer",()=>lesson(ci),st.read&&!st.i));
  q.append(el("div","tag","Quiz du cours"),el("div","t",QN+" questions tirées parmi "+QUIZ[ci].length),
    el("div","mut",st.best!=null?"Meilleur score : "+st.best+"/"+QN+" · "+plural(st.n||1,"tentative"):"Validé à partir de "+QPASS+"/"+QN+", sans seconde chance"),
    btn(st.best!=null?"Repasser le quiz":"Passer le quiz",()=>courseQuiz(ci),!st.read||passed(ci)));
  if(!st.read) q.append(el("div","mut hint","Conseillé après la leçon"));
  screen([top(home,passed(ci)?1:st.read?.6:st.i/c.steps.length*.6,null,"Retour au parcours"),el("div","tag","Cours "+(ci+1)),el("h2",null,c.title),el("p","mut",c.sub),l,q],null,home);
}

// Affiche une question.
// o.mode : learn (on peut réessayer), quiz (correction immédiate), exam (aucune correction)
function ask(s,o){
  const card=el("div"), tagEl=el("div","tag",o.tag), h=el("h2",null,s.q);
  let pick=null, tries=0, retry=null; const blanks=[];
  h.id="q"; card.append(tagEl,h);
  if(s.code){
    const pre=el("pre"), parts=s.code.split("____");
    parts.forEach((t,k)=>{pre.append(t); if(k<parts.length-1){const b=el("span","blank","____"); blanks.push(b); pre.append(b);}});
    card.append(pre);
  }
  const setBlank=v=>blanks.forEach(b=>{b.textContent=v||"____"; b.classList.toggle("on",!!v);});
  const check=btn(o.label||"Vérifier",onCheck); check.disabled=true;
  const mark=b=>opts.forEach(x=>{const on=x===b; x.classList.toggle("sel",on); x.setAttribute("aria-checked",String(on));});
  const opts=shuffle(s.opts).map(v=>{
    const b=el("button","opt",v);
    b.setAttribute("role","radio"); b.setAttribute("aria-checked","false");
    // Après une erreur en leçon, toucher une autre réponse relance directement l'essai
    b.onclick=()=>{ if(retry) retry(); pick=v; mark(b); setBlank(v); check.disabled=false; };
    return b;
  });
  const box=el("div",blanks.length?"chips":s.q===OUT?"mono":null);
  box.setAttribute("role","radiogroup"); box.setAttribute("aria-labelledby","q");
  box.append(...opts); card.append(box);
  let base=check;
  if(o.back){base=el("div","rowb"); base.append(btn("Précédent",o.back,true),check);}
  const foot=screen([top(o.exit,o.p,o.back),card],[base],o.onBack||o.exit);
  if(o.deadline){
    const upd=()=>{ const r=o.deadline-Date.now(); if(r<=0) return o.onTimeout(); tagEl.textContent=o.tag+" · "+clock(r); };
    upd(); if(o.deadline>Date.now()) TICK=setInterval(upd,500);
  }
  // Fait défiler pour que la bonne réponse reste visible au-dessus du pied collant
  const showGood=()=>requestAnimationFrame(()=>{
    const g=box.querySelector(".good"); if(!g) return;
    const r=g.getBoundingClientRect(), ft=foot.getBoundingClientRect().top;
    if(r.bottom>ft-12) window.scrollBy({top:r.bottom-ft+12,behavior:"smooth"});
    else if(r.top<0) window.scrollBy({top:r.top-12,behavior:"smooth"});
  });
  function onCheck(){
    const good=pick===s.opts[0], cur=opts.find(x=>x.textContent===pick);
    if(o.onCheck) o.onCheck(good,pick);
    if(o.mode==="exam") return o.cb();
    tries++; cur.classList.remove("sel");
    const fb=el("div","fb "+(good?"g":"b")), cont=btn("Continuer",()=>o.cb(good&&tries===1));
    fb.setAttribute("role","status");
    fb.append(el("div","t",good?(tries===1?"Correct !":"Correct, bien rattrapé."):"Pas tout à fait."));
    const reveal=()=>{
      retry=null;
      opts.forEach(x=>{x.disabled=true; if(x.textContent===s.opts[0])x.classList.add("good");});
      setBlank(s.opts[0]); fb.append(el("div","why",s.why));
      const extra=!good&&o.review&&NOTION[s.ref]?[reviewBtn(s.ref)]:[];
      foot.replaceChildren(fb,cont,...extra); cont.focus({preventScroll:true}); showGood();
    };
    if(good) return reveal();
    cur.classList.add("bad"); cur.disabled=true; cur.setAttribute("aria-checked","false");
    if(o.mode==="quiz") return reveal();
    check.disabled=true; pick=null;
    retry=()=>{ retry=null; setBlank(""); foot.replaceChildren(base); };
    foot.replaceChildren(fb,btn("Réessayer",()=>retry()),
      btn("Voir l'explication",()=>{fb.className="fb"; fb.replaceChildren(el("div","t","Explication")); reveal();},true));
  }
}

function lesson(ci){
  const c=COURSES[ci], st=cs(ci), exit=()=>coursePage(ci);
  S.lc=ci;
  if(st.i>=c.steps.length){
    const first=!st.read;
    st.i=0; st.read=true; gain(first?20:0);
    const d=el("div","center"); d.append(el("div","tag","Leçon terminée"),el("h2",null,c.title));
    if(first) d.append(el("div","big okc","+20 XP"));
    d.append(el("p","mut","Place au quiz du cours : "+QN+" questions tirées parmi "+QUIZ[ci].length+", sans seconde chance."));
    return screen([d],[btn("Passer le quiz",()=>courseQuiz(ci)),btn("Plus tard",home,true)],home);
  }
  const s=c.steps[st.i], n=c.steps.length, p=st.i/n, pos=" · "+(st.i+1)+"/"+n;
  const next=()=>{st.i++; save(); lesson(ci);};
  const back=st.i>0?()=>{st.i--; save(); lesson(ci);}:null;
  // XP accordé une seule fois par exercice : ni en revenant en arrière, ni en relisant la leçon
  if(s.k==="q") return ask(s,{mode:"learn",tag:"Exercice"+pos,exit,p,back,onBack:back||exit,
    cb:first=>{ if(!st.read&&st.i>=(st.m||0)){st.m=st.i+1; gain(first?10:5);} next(); }});
  let foot=btn("Continuer",next);
  if(back){const r=el("div","rowb"); r.append(btn("Précédent",back,true),foot); foot=r;}
  screen([top(exit,p,back),notionBody(s,"Notion"+pos)],[foot],back||exit);
}

// Déroule une série de questions. o.record(res) est appelé après chaque réponse :
// la tentative est donc comptée dès la première réponse, même en cas d'abandon.
function run(qs,o){
  const res=[]; let i=0;
  const finish=()=>o.done(res);
  const quit=()=>{
    if(!res.length) return o.exit();
    const d=el("div","center");
    d.append(el("div","tag",o.name),el("h2",null,"Abandonner ?"),el("p","mut",o.msg||"La tentative est déjà comptée, avec le score obtenu jusqu'ici."));
    screen([d],[btn(o.again,step),btn("Abandonner",o.exit,true)],step);
  };
  function step(){
    if(i>=qs.length||(o.deadline&&Date.now()>=o.deadline)) return finish();
    const last=i===qs.length-1, q=qs[i];
    ask(q,{mode:o.mode,tag:"Question "+(i+1)+"/"+qs.length,exit:quit,onBack:quit,p:(i+1)/qs.length,review:o.review,
      deadline:o.deadline,onTimeout:finish,label:o.mode==="exam"?(last?"Terminer l'examen":"Valider"):null,
      onCheck:(ok,pick)=>{ res.push({s:q,ok,pick}); i++; if(o.record) o.record(res); },cb:step});
  }
  step();
}
// Points faibles : une question ratée entre dans la liste, elle en sort après deux réussites de suite en révision
const missed=r=>{ if(!r.ok) S.w[r.s.id]=0; };

function courseQuiz(ci){
  const c=COURSES[ci], st=cs(ci), val=n=>n*10+(n>=QPASS?20:0); let xp=0;
  run(shuffle(QUIZ[ci]).slice(0,QN),{mode:"quiz",name:"Quiz : "+c.title,again:"Continuer le quiz",review:true,exit:()=>coursePage(ci),
    record:res=>{
      const score=res.filter(r=>r.ok).length;
      if(res.length===1) st.n=(st.n||0)+1;
      missed(res[res.length-1]);
      // XP : seulement l'écart avec le meilleur score précédent
      let g=0; if(st.best==null||score>st.best){ g=val(score)-val(st.best||0); st.best=score; }
      xp+=g; gain(g);
    },
    done:res=>{
      const score=res.filter(r=>r.ok).length, ok=score>=QPASS;
      const d=el("div","center");
      d.append(el("div","tag","Quiz : "+c.title),el("div","big "+(ok?"okc":"koc"),score+"/"+QN),el("h2",null,ok?"Cours validé":"Encore un effort"));
      const info=(ok?"":"Il faut "+QPASS+"/"+QN+" pour valider. La prochaine tentative tirera d'autres questions. ")+(xp>0?"+"+xp+" XP":"");
      if(info) d.append(el("p","mut",info));
      const foot=[];
      if(ok) foot.push(ci+1<COURSES.length?btn("Cours suivant",()=>coursePage(ci+1)):btn("Passer l'examen blanc",examIntro));
      else foot.push(btn("Repasser le quiz",()=>courseQuiz(ci)),btn("Revoir la leçon",()=>lesson(ci),true));
      foot.push(btn("Retour au parcours",home,true));
      screen([d],foot,home);
    }});
}

function weakSession(){
  const qs=shuffle(weakIds()).slice(0,WEAK_N).map(id=>ALLQ[id]); let xp=0;
  if(!qs.length) return home();
  run(qs,{mode:"quiz",name:"Points faibles",again:"Continuer la révision",review:true,exit:home,msg:"Les réponses déjà données restent enregistrées.",
    record:res=>{
      const r=res[res.length-1], id=r.s.id;
      if(!r.ok) S.w[id]=0;
      else { S.w[id]=(S.w[id]||0)+1; if(S.w[id]>=2) delete S.w[id]; xp+=2; }
      gain(r.ok?2:0);
    },
    done:res=>{
      const score=res.filter(r=>r.ok).length, left=weakIds().length, d=el("div","center");
      d.append(el("div","tag","Points faibles"),el("div","big "+(score===res.length?"okc":""),score+"/"+res.length),
        el("h2",null,left?"Encore "+plural(left,"question")+" à consolider":"Liste vidée, bravo"),
        el("p","mut","Une question sort de la liste après deux bonnes réponses de suite."+(xp>0?" +"+xp+" XP":"")));
      const foot=[]; if(left) foot.push(btn("Continuer la révision",weakSession));
      foot.push(btn("Retour au parcours",home,!!left));
      screen([d],foot,home);
    }});
}

function examIntro(){
  const d=el("div","center");
  d.append(el("div","tag","Examen blanc"),el("h2",null,EXAM_LEN+" questions, "+EXAM_MS/60000+" minutes"),
    el("p",null,"2 questions par cours et "+EXAM_X+" pièges généraux. Aucune correction avant la fin."),
    el("p","mut","Le chronomètre démarre maintenant et ne s'arrête pas, même si vous quittez l'app. À zéro, les questions sans réponse comptent comme fausses. Seuil de réussite : "+EXAM_PASS+"/"+EXAM_LEN+"."));
  if(S.exam!=null) d.append(el("p","mut","Meilleur score : "+S.exam+"/"+EXAM_LEN+" · "+plural(S.examN||1,"tentative")));
  screen([d],[btn("Commencer l'examen",exam),btn("Retour au parcours",home,true)],home);
}

function exam(){
  // 2 questions par cours et quelques pièges généraux, dans un ordre mélangé
  const qs=shuffle(QUIZ.flatMap(z=>shuffle(z).slice(0,2)).concat(shuffle(EXTRA).slice(0,EXAM_X)));
  const start=Date.now(), deadline=start+EXAM_MS; let xp=0;
  run(qs,{mode:"exam",name:"Examen blanc",again:"Continuer l'examen",exit:home,deadline,
    record:res=>{
      const score=res.filter(r=>r.ok).length;
      if(res.length===1) S.examN=(S.examN||0)+1;
      missed(res[res.length-1]);
      let g=0; if(S.exam==null||score>S.exam){ g=(score-(S.exam||0))*5; S.exam=score; }
      xp+=g; gain(g);
    },
    done:res=>{
      const used=Math.min(Date.now(),deadline)-start, late=Date.now()>=deadline&&res.length<qs.length;
      const score=res.filter(r=>r.ok).length, ok=score>=EXAM_PASS, skipped=qs.slice(res.length);
      const d=el("div","center"), sec=Math.round(used/1000);
      d.append(el("div","tag","Examen blanc"),el("div","big "+(ok?"okc":"koc"),score+"/"+qs.length),
        el("h2",null,late?"Temps écoulé":ok?"Seuil atteint":"Seuil non atteint"),
        el("p","mut","Temps : "+Math.floor(sec/60)+" min "+String(sec%60).padStart(2,"0")+" s sur "+EXAM_MS/60000+" min. Seuil : "+EXAM_PASS+"/"+qs.length+"."+(xp>0?" +"+xp+" XP":"")));
      const body=[d], sc=el("div","card");
      sc.append(el("div","tag","Score par cours"));
      COURSES.map((c,i)=>[(i+1)+". "+c.title,i]).concat([["Pièges généraux",-1]]).forEach(([name,k])=>{
        const all=qs.filter(q=>q.c===k).length, n=res.filter(r=>r.s.c===k&&r.ok).length, row=el("div","sc");
        row.append(el("span",null,name),el("b",n===all?"okc":n?null:"koc",n+"/"+all)); sc.append(row);
      });
      body.push(sc);
      const lab=(cls,l,txt,mono)=>{const o=el("div","opt "+cls+(mono?" mono":"")); o.append(el("span","lab",l),txt); return o;};
      const errCard=(q,pick)=>{
        const c=el("div","card err"); c.append(el("div","t",q.q));
        if(q.code) c.append(el("pre",null,q.code));
        const mono=q.q===OUT;
        c.append(pick==null?lab("bad","Votre réponse :","Sans réponse (temps écoulé)"):lab("bad","Votre réponse :",pick,mono),lab("good","Bonne réponse :",q.opts[0],mono));
        const w=el("div","why",q.why); w.style.marginTop="12px"; c.append(w);
        if(NOTION[q.ref]){const b=reviewBtn(q.ref); b.className="btn link"; c.append(b);}
        body.push(c);
      };
      res.filter(r=>!r.ok).forEach(r=>errCard(r.s,r.pick));
      skipped.forEach(q=>{ S.w[q.id]=0; errCard(q,null); });
      save();
      screen(body,[btn("Refaire un examen",examIntro),btn("Retour au parcours",home,true)],home);
    }});
}
home();
})();
